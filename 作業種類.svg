<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="#f8fafc"/>

  <!-- 頂部返回列 -->
  <g transform="translate(32, 24)">
    <rect width="130" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="txt" x="16" y="20" font-size="12" font-weight="700" fill="#64748b">← 返回作業列表</text>
  </g>

  <!-- 標題與新增按鈕 -->
  <g transform="translate(32, 70)">
    <text class="txt" x="0" y="28" font-size="26" font-weight="900" fill="#4f46e5">作業種類管理</text>
    <text class="txt" x="0" y="52" font-size="12" font-weight="500" fill="#64748b">配置適用於不同學科的作業狀態。每個種類最多支援 4 個核心狀態切換。</text>
    <rect x="760" y="4" width="136" height="36" rx="18" fill="#1e293b"/>
    <text class="txt" x="788" y="27" font-size="12" font-weight="800" fill="#ffffff">+ 新增自訂種類</text>
  </g>

  <!-- 4 張直式卡片 (每張寬 206, 間距 18) -->
  <g transform="translate(32, 140)">
    <!-- 卡片 1: 一般作業 -->
    <g transform="translate(0, 0)">
      <rect width="206" height="340" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text class="txt" x="18" y="36" font-size="16" font-weight="900" fill="#0f172a">一般作業</text>
      <!-- 4 狀態項 -->
      <!-- 1 未繳交 -->
      <g transform="translate(18, 60)">
        <circle cx="8" cy="12" r="5" fill="#94a3b8"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#334155">未繳交</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <!-- 2 已繳交 -->
      <g transform="translate(18, 100)">
        <circle cx="8" cy="12" r="5" fill="#2563eb"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#2563eb">已繳交</text>
        <rect x="120" y="4" width="14" height="14" rx="3.5" fill="#4f46e5"/>
        <polyline points="123.5,11.2 126.2,13.9 130.8,8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#4f46e5">完成</text>
      </g>
      <!-- 3 待訂正 -->
      <g transform="translate(18, 140)">
        <circle cx="8" cy="12" r="5" fill="#f59e0b"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#d97706">待訂正</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <!-- 4 已完成 -->
      <g transform="translate(18, 180)">
        <circle cx="8" cy="12" r="5" fill="#10b981"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#059669">已完成</text>
        <rect x="120" y="4" width="14" height="14" rx="3.5" fill="#10b981"/>
        <polyline points="123.5,11.2 126.2,13.9 130.8,8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#059669">完成</text>
      </g>
      <!-- 虛線新增狀態按鈕 -->
      <rect x="18" y="278" width="170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
      <text class="txt" x="103" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">+ 新增狀態</text>
    </g>

    <!-- 卡片 2: 閱讀作業 -->
    <g transform="translate(228, 0)">
      <rect width="206" height="340" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text class="txt" x="18" y="36" font-size="16" font-weight="900" fill="#0f172a">閱讀作業</text>
      <g transform="translate(18, 60)">
        <circle cx="8" cy="12" r="5" fill="#94a3b8"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#334155">未閱讀</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <g transform="translate(18, 100)">
        <circle cx="8" cy="12" r="5" fill="#10b981"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#059669">已閱讀</text>
        <rect x="120" y="4" width="14" height="14" rx="3.5" fill="#10b981"/>
        <polyline points="123.5,11.2 126.2,13.9 130.8,8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#059669">完成</text>
      </g>
      <rect x="18" y="278" width="170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
      <text class="txt" x="103" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">+ 新增狀態</text>
    </g>

    <!-- 卡片 3: pagamo -->
    <g transform="translate(456, 0)">
      <rect width="206" height="340" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text class="txt" x="18" y="36" font-size="16" font-weight="900" fill="#0f172a">pagamo</text>
      <g transform="translate(18, 60)">
        <circle cx="8" cy="12" r="5" fill="#94a3b8"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#334155">未闖關</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <g transform="translate(18, 100)">
        <circle cx="8" cy="12" r="5" fill="#ef4444"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#dc2626">已闖關</text>
        <rect x="120" y="4" width="14" height="14" rx="3.5" fill="#10b981"/>
        <polyline points="123.5,11.2 126.2,13.9 130.8,8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#059669">完成</text>
      </g>
      <rect x="18" y="278" width="170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
      <text class="txt" x="103" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">+ 新增狀態</text>
    </g>

    <!-- 卡片 4: 因材網 -->
    <g transform="translate(684, 0)">
      <rect width="206" height="340" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text class="txt" x="18" y="36" font-size="16" font-weight="900" fill="#0f172a">因材網</text>
      <g transform="translate(18, 60)">
        <circle cx="8" cy="12" r="5" fill="#94a3b8"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#334155">未測驗</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <g transform="translate(18, 100)">
        <circle cx="8" cy="12" r="5" fill="#ef4444"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#dc2626">未通過</text>
        <rect x="120" y="4" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#94a3b8">完成</text>
      </g>
      <g transform="translate(18, 140)">
        <circle cx="8" cy="12" r="5" fill="#10b981"/>
        <text class="txt" x="22" y="16" font-size="12" font-weight="700" fill="#059669">已通過</text>
        <rect x="120" y="4" width="14" height="14" rx="3.5" fill="#10b981"/>
        <polyline points="123.5,11.2 126.2,13.9 130.8,8.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="txt" x="138" y="16" font-size="10" font-weight="600" fill="#059669">完成</text>
      </g>
      <rect x="18" y="278" width="170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
      <text class="txt" x="103" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">+ 新增狀態</text>
    </g>
  </g>
</svg>
