<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 背景底色（圓角矩形，App 圖標標準外觀） -->
  <rect width="512" height="512" rx="115" fill="#4F46E5"/>

  <!-- 作業本主體（象徵作業/點收冊） -->
  <rect x="136" y="106" width="240" height="300" rx="28" fill="#FFFFFF"/>

  <!-- 作業本側邊裝訂條 -->
  <path d="M 136,134 A 28,28 0 0 1 164,106 L 180,106 L 180,406 L 164,406 A 28,28 0 0 1 136,378 Z" fill="#E0E7FF"/>

  <!-- 點收橫線（代表清單條目） -->
  <line x1="210" y1="176" x2="330" y2="176" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="236" x2="330" y2="236" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="296" x2="280" y2="296" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round"/>

  <!-- 點收完成勾選徽章（右下角突出圓形與勾勾） -->
  <circle cx="346" cy="346" r="68" fill="#10B981" stroke="#FFFFFF" stroke-width="12"/>
  
  <!-- 打勾路徑（乾淨簡潔的粗線條） -->
  <path d="M318 346 L338 366 L376 326" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
