<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
    </style>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 背景暗層 -->
  <rect width="700" height="500" fill="#64748b" opacity="0.4"/>

  <!-- Modal 主視窗 -->
  <g transform="translate(100, 20)">
    <rect width="500" height="460" rx="24" fill="#ffffff" filter="url(#modalShadow)"/>

    <!-- 標題 -->
    <text class="txt" x="32" y="46" font-size="22" font-weight="900" fill="#0f172a">新增作業</text>

    <!-- 欄位 1: 作業名稱 (聚焦高亮藍框) -->
    <g transform="translate(32, 70)">
      <text class="txt" x="0" y="0" font-size="13" font-weight="800" fill="#334155">作業名稱</text>
      <rect x="0" y="10" width="436" height="44" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
      <text class="txt" x="16" y="38" font-size="14" font-weight="800" fill="#0f172a">晴空小侍郎</text>
    </g>

    <!-- 欄位 2: 作業種類 -->
    <g transform="translate(32, 150)">
      <text class="txt" x="0" y="0" font-size="13" font-weight="800" fill="#334155">作業種類</text>
      <rect x="0" y="10" width="436" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="txt" x="16" y="38" font-size="14" font-weight="700" fill="#1e293b">閱讀作業</text>
      <text class="txt" x="410" y="38" font-size="12" font-weight="700" fill="#64748b">▾</text>
    </g>

    <!-- 欄位 3 & 4 並排: 最後座號 (24) 與 缺號 (23) -->
    <g transform="translate(32, 230)">
      <!-- 最後座號 -->
      <g transform="translate(0, 0)">
        <text class="txt" x="0" y="0" font-size="13" font-weight="800" fill="#334155">最後座號</text>
        <rect x="0" y="10" width="208" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="16" y="38" font-size="14" font-weight="700" fill="#0f172a">24</text>
      </g>
      <!-- 缺號 (選填) -->
      <g transform="translate(228, 0)">
        <text class="txt" x="0" y="0" font-size="13" font-weight="800" fill="#334155">缺號（選填）</text>
        <rect x="0" y="10" width="208" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="16" y="38" font-size="14" font-weight="700" fill="#0f172a">23</text>
      </g>
    </g>

    <!-- 提示小字 -->
    <text class="txt" x="32" y="318" font-size="11" font-weight="500" fill="#94a3b8">※ 支援逗號開或連字號範圍，缺號將被直接排除。</text>

    <!-- 底部按鈕: 取消與儲存作業 -->
    <g transform="translate(32, 380)">
      <rect x="0" y="0" width="80" height="42" rx="10" fill="#f1f5f9"/>
      <text class="txt" x="40" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">取消</text>
      <rect x="326" y="0" width="110" height="42" rx="10" fill="#4f46e5"/>
      <text class="txt" x="381" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">儲存作業</text>
    </g>
  </g>
</svg>
