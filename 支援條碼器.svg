<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
    </style>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 背景暗層 (模擬背景 Modal 彈出) -->
  <rect width="800" height="620" fill="#64748b" opacity="0.4"/>

  <!-- Modal 主視窗 (白色大圓角卡片) -->
  <g transform="translate(100, 30)">
    <rect width="600" height="560" rx="24" fill="#ffffff" filter="url(#modalShadow)"/>

    <!-- 標題與副標題 -->
    <text class="txt" x="32" y="44" font-size="22" font-weight="900" fill="#0f172a">學生條碼設定</text>
    <text class="txt" x="32" y="68" font-size="12" font-weight="500" fill="#64748b">設定後可於點收頁面利用條碼槍快速登記。</text>

    <!-- 黃色警告提示方塊：智慧連續條碼設定 -->
    <g transform="translate(32, 88)">
      <rect width="536" height="64" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <text class="txt" x="16" y="24" font-size="13" font-weight="800" fill="#b45309">⚡ 智慧連續條碼設定</text>
      <text class="txt" x="16" y="46" font-size="11" font-weight="500" fill="#92400e">請手動輸入 1 號 到 3 號 條碼，系統自動分析等差數列並填滿全班。</text>
      <!-- 自動推算按鈕 -->
      <rect x="420" y="16" width="100" height="32" rx="8" fill="#f59e0b"/>
      <text class="txt" x="470" y="37" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">自動推算</text>
    </g>

    <!-- 班級人數設定列 -->
    <g transform="translate(32, 168)">
      <text class="txt" x="0" y="24" font-size="13" font-weight="700" fill="#334155">班級人數：</text>
      <rect x="80" y="2" width="70" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text class="txt" x="115" y="25" text-anchor="middle" font-size="15" font-weight="800" fill="#1e293b">30</text>
      <!-- 套用人數按鈕 -->
      <rect x="162" y="2" width="94" height="34" rx="8" fill="#4f46e5"/>
      <text class="txt" x="209" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">套用人數</text>
    </g>

    <!-- 學生條碼列表 (1號~4號) -->
    <g transform="translate(32, 224)">
      <!-- 1 號 -->
      <g transform="translate(0, 0)">
        <text class="txt" x="0" y="26" font-size="14" font-weight="800" fill="#334155">1 號</text>
        <rect x="50" y="2" width="486" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="66" y="26" font-size="14" font-family="monospace" font-weight="700" fill="#0f172a">B0AI01</text>
      </g>
      <!-- 2 號 -->
      <g transform="translate(0, 52)">
        <text class="txt" x="0" y="26" font-size="14" font-weight="800" fill="#334155">2 號</text>
        <rect x="50" y="2" width="486" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="66" y="26" font-size="14" font-family="monospace" font-weight="700" fill="#0f172a">B0AI02</text>
      </g>
      <!-- 3 號 -->
      <g transform="translate(0, 104)">
        <text class="txt" x="0" y="26" font-size="14" font-weight="800" fill="#334155">3 號</text>
        <rect x="50" y="2" width="486" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="66" y="26" font-size="14" font-family="monospace" font-weight="700" fill="#0f172a">B0AI03</text>
      </g>
      <!-- 4 號 -->
      <g transform="translate(0, 156)">
        <text class="txt" x="0" y="26" font-size="14" font-weight="800" fill="#334155">4 號</text>
        <rect x="50" y="2" width="486" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text class="txt" x="66" y="26" font-size="14" font-family="monospace" font-weight="700" fill="#0f172a">B0AI04</text>
      </g>
      <!-- 省略點點 -->
      <g transform="translate(0, 204)">
        <text class="txt" x="293" y="16" text-anchor="middle" font-size="16" font-weight="700" fill="#94a3b8">⋮ 其餘座號自動連續對應至 30 號</text>
      </g>
    </g>

    <!-- 底部操作按鈕：取消與儲存配置 -->
    <g transform="translate(32, 496)">
      <rect x="0" y="0" width="80" height="40" rx="10" fill="#f1f5f9"/>
      <text class="txt" x="40" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">取消</text>
      <rect x="426" y="0" width="110" height="40" rx="10" fill="#4f46e5"/>
      <text class="txt" x="481" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">儲存配置</text>
    </g>
  </g>
</svg>
